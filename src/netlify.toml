# Exception for universal links
# Android App Links
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/.well-known/assetlinks.json"
  status = 200
  force = true 

# iOS Universal Links
[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/.well-known/apple-app-site-association"
  status = 200
  force = true

# Exception for /open (universal link)
[[redirects]]
  from = "/open"
  to = "/open"
  status = 200
  force = true
  
# Home page - de
[[redirects]]
  from = "/"
  to = "/de/"
  status = 200
  conditions = {Language = ["de"]}

# Home page - default
[[redirects]]
  from = "/"
  to = "/en/"
  status = 200

# 404 - de
[[redirects]]
  from = "/de/*"
  to = "/de/404"
  status = 404

# 404 - default
[[redirects]]
  from = "/en/*"
  to = "/en/404"
  status = 404

# Redirect for end-user’s browser preference override
[[redirects]]
  from = "/*"
  to = "/de/:splat"
  status = 302
  conditions = {Language = ["de"]}

# Default
[[redirects]]
  from = "/*"
  to = "/en/:splat"
  status = 302